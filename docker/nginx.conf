worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Binary .gz assets are decoded by the game, not by HTTP content encoding.
    gzip off;
    gzip_static off;

    # Keep all headers at server scope: location add_header would replace them.
    map $uri $release_cache_control {
        default "";
        /index.html "no-cache";
        /service-worker.js "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # frame-ancestors is only enforced when delivered as an HTTP header.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $release_cache_control always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

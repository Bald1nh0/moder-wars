<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Modern Wars — social preview</title>
  <desc>Modern Wars wordmark and golden compass shield over the game's map of Europe.</desc>
  <defs>
    <linearGradient id="shade">
      <stop stop-color="#09131f"/>
      <stop offset=".42" stop-color="#09131f" stop-opacity=".98"/>
      <stop offset=".72" stop-color="#09131f" stop-opacity=".5"/>
      <stop offset="1" stop-color="#09131f" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="edge" x2="0" y2="1">
      <stop stop-color="#09131f" stop-opacity=".1"/>
      <stop offset=".72" stop-color="#09131f" stop-opacity="0"/>
      <stop offset="1" stop-color="#09131f" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#09131f"/>
  <image href="title-map.svg" x="180" y="-70" width="1100" height="820" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect width="1200" height="630" fill="url(#edge)"/>
  <rect x="28" y="28" width="1144" height="574" rx="2" fill="none" stroke="#d9b85f" stroke-opacity=".3"/>
  <image href="favicon.svg" x="68" y="66" width="66" height="66"/>
  <text x="153" y="94" fill="#e6c87c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">GRAND STRATEGY</text>
  <text x="153" y="118" fill="#a6bac9" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">IN YOUR BROWSER</text>
  <g fill="#fff5e8" font-family="Georgia, 'Liberation Serif', serif" font-size="108" font-weight="700" letter-spacing="-3">
    <text x="68" y="274">MODERN</text>
    <text x="68" y="378">WARS</text>
  </g>
  <path d="M72 414H154" stroke="#e6c87c" stroke-width="3"/>
  <text x="70" y="460" fill="#dce5ec" font-family="Arial, sans-serif" font-size="25">Your world. Your strategy.</text>
  <text x="70" y="542" fill="#e6c87c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARMIES · ECONOMY · DIPLOMACY</text>
  <text x="1130" y="564" text-anchor="end" fill="#b7c9d4" font-family="Arial, sans-serif" font-size="15">modern-wars.bald1nh0.net</text>
</svg>
